<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title>CS6460 Quiz Drill</title>
    <link rel="stylesheet" href="./styles.css?v=32" />
  </head>
  <body>
    <nav class="nav" aria-label="CS6460 quiz drill">
      <div class="nav-top">
        <button type="button" id="open-sheet" class="burger" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
        <p id="nav-title" class="nav-title">CS6460</p>
        <span id="app-build" class="app-build" aria-label="App build">v32</span>
        <div class="mode-toggle" role="tablist" aria-label="Mode">
          <button type="button" id="mode-read" class="mode active" aria-pressed="true">Read</button>
          <button type="button" id="mode-quiz" class="mode" aria-pressed="false">Quiz</button>
        </div>
      </div>
      <div id="read-controls" class="nav-row">
        <button type="button" id="flip">Face: term</button>
        <button type="button" id="collapse-all">Collapse</button>
        <button type="button" id="sections">Sections: on</button>
      </div>
      <div id="quiz-controls" class="match-meter" hidden>
        <div class="match-meter-row">
          <span id="quiz-pct" class="match-pct">0%</span>
          <span id="quiz-status" class="match-status"></span>
        </div>
        <div class="match-meter-track" aria-hidden="true">
          <div id="quiz-meter-fill" class="match-meter-fill"></div>
        </div>
      </div>
      <p id="deadline" class="deadline" hidden></p>
    </nav>

    <div id="quiz-next-hit" class="match-next-hit" hidden aria-label="Tap for next"></div>

    <div id="backdrop" class="backdrop" hidden></div>
    <div id="sheet" class="sheet" hidden role="dialog" aria-label="Drill options">
      <div class="sheet-head">
        <strong>CS6460 · Honorlock</strong>
        <button type="button" id="close-sheet">Done</button>
      </div>
      <p class="muted">Closed-book quiz drill only. 6795 stays in the Know file — open notes there.</p>
      <p class="label">Week (Read)</p>
      <div id="weeks" class="week-list"></div>
      <p class="label">How to use</p>
      <p class="muted">Read = lecture-context init. Quiz = scene → 4 paraphrase choices → explainer. Then Honorlock practice. No Match.</p>
      <p class="label">Scene quiz</p>
      <p id="quiz-sheet-stats" class="muted"></p>
      <div class="sheet-actions">
        <button type="button" id="quiz-reset">Reset scene quiz</button>
      </div>
      <p class="label">Quiz window</p>
      <p id="quiz-detail" class="muted"></p>
      <p class="label">Checkpoint</p>
      <p id="checkpoint"></p>
      <p id="synced" class="muted"></p>
      <p id="missing" class="muted"></p>
    </div>

    <main>
      <article id="article"></article>
      <section id="scene-quiz" class="match" hidden aria-label="Scene quiz"></section>
    </main>
    <script src="./app.js?v=32"></script>
  </body>
</html>
